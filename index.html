<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hawkins English Lab</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f4e9e2;font-family:Arial,sans-serif}.stage{max-width:1301px;margin:0 auto;min-height:100vh;background:#efe4de;box-shadow:0 0 40px #6b59621f}.hero-wrap{width:100%;background:linear-gradient(135deg,#fbded1,#eedfea,#dce7ef);min-height:365px;display:flex;align-items:center;justify-content:center;overflow:hidden}.hero-wrap img{display:block;width:100%;height:auto;max-width:1301px}.paper{margin:-2px 18px 30px;min-height:620px;border:2px solid #e0c2b8;border-radius:26px;background:linear-gradient(rgba(255,249,236,.94),rgba(255,246,229,.96)),repeating-linear-gradient(0deg,#fff8e8 0 3px,#faefd9 4px 5px);box-shadow:0 12px 26px rgba(69,52,66,.13),inset 0 0 30px rgba(190,142,115,.08);position:relative}.paper:before{content:"";position:absolute;inset:10px;border:2px dashed rgba(200,145,150,.45);border-radius:19px;pointer-events:none}.loading{color:#7f6571;font-weight:700;letter-spacing:.08em}@media(max-width:700px){.hero-wrap{min-height:0}.paper{margin:0 8px 18px;min-height:620px;border-radius:18px}.paper:before{inset:7px}}</style></head><body><main class="stage"><section class="hero-wrap"><span class="loading" id="loading">HAWKINS ENGLISH LAB...</span><img id="hero" alt="Hawkins English Lab" hidden></section><section class="paper" aria-label="Рабочая область"></section></main><script>(async()=>{try{const parts=await Promise.all([1,2,3,4].map(i=>fetch(`assets/hero${i}.txt?v=3`).then(r=>r.text())));const img=document.getElementById('hero');img.src='data:image/webp;base64,'+parts.join('');img.onload=()=>{document.getElementById('loading').remove();img.hidden=false}}catch(e){document.getElementById('loading').textContent='Обнови страницу'}})();</script></body></html>
